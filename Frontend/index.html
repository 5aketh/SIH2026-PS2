<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackWise — Packaging that fits what's inside</title>
<meta name="description" content="PackWise recommends barrier, film and format options matched to your food product, shelf life and budget.">
<script>
  /* Runs before first paint: theme + animation mode, so nothing flashes. */
  (function () {
    var d = document.documentElement, t = 'dark';
    try { var s = localStorage.getItem('packwise-theme'); if (s === 'light' || s === 'dark') t = s; } catch (e) {}
    d.setAttribute('data-theme', t);
    try {
      if (window.matchMedia && matchMedia('(min-width: 720px) and (min-height: 600px)').matches) {
        d.classList.add('is-animated');
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
